name: Build tvOS Probe

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"
  TRUSTED_BUILD_CACHE_VERSION: trusted-build-probe-v5
  TVOS_ENGINE_URL: "https://github.com/fluttertv/engine-artifacts/releases/download/engine-b118f6897f8f3427d1390c80bbefa90ee948c97e/tvos_release_arm64.zip"

jobs:
  build-tvos:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tvos-probe-stripped
          persist-credentials: false


      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d ' ')
          BUILD_NAME="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION#*+}"
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false
          cache-save-always: true

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          save-always: true

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            tvos/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-tvos-pods-${{ hashFiles('tvos/Podfile.lock') }}
          save-always: true

      - name: Cache tvOS engine
        id: tvos-engine-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: tvos-engine
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-tvos-engine-b118f6897f8f3427d1390c80bbefa90ee948c97e
          save-always: true

      - name: Download tvOS Flutter engine
        if: steps.tvos-engine-cache.outputs.cache-hit != 'true'
        run: |
          curl -L ${{ env.TVOS_ENGINE_URL }} -o tvos-engine.zip
          unzip tvos-engine.zip -d engine-extract
          mkdir -p tvos-engine/out/tvos_release
          cp -r engine-extract/tvos_release_arm64/* tvos-engine/out/tvos_release/
          mkdir -p tvos-engine/out/tvos_debug_sim_unopt_arm64
          mkdir -p tvos-engine/out/tvos_debug_unopt

      - name: Inspect engine contents
        run: |
          echo "===== tvos-engine/out/ structure ====="
          find tvos-engine/out -maxdepth 4 | sort
          echo ""
          echo "===== Flutter.framework location ====="
          find tvos-engine -name "Flutter.framework" -type d | head -5
          echo ""
          echo "===== gen_snapshot location ====="
          find tvos-engine -name "gen_snapshot*" | head -10
          echo ""
          echo "===== Key symbols in Flutter.framework ====="
          FLUTTER_FW=$(find tvos-engine -name "Flutter.framework" -type d | head -1)
          if [ -n "$FLUTTER_FW" ]; then
            echo "Found: $FLUTTER_FW"
            nm "$FLUTTER_FW/Flutter" 2>/dev/null | grep -i "SceneDelegate" \
              || echo "FlutterSceneDelegate NOT FOUND"
            nm "$FLUTTER_FW/Flutter" 2>/dev/null | grep -i "ImplicitEngine" \
              || echo "FlutterImplicitEngineDelegate NOT FOUND"
            nm "$FLUTTER_FW/Flutter" 2>/dev/null | grep -i "FlutterAppDelegate" | head -3 \
              || echo "FlutterAppDelegate NOT FOUND"
          else
            echo "Flutter.framework NOT FOUND anywhere"
          fi


      - name: Install Flutter dependencies
        run: flutter pub get --no-example

      - name: Print GeneratedPluginRegistrant (iOS/tvOS)
        run: |
          echo "===== tvos/Runner/GeneratedPluginRegistrant.* ====="
          ls -la tvos/Runner/GeneratedPluginRegistrant* 2>/dev/null || true
          for f in tvos/Runner/GeneratedPluginRegistrant.swift tvos/Runner/GeneratedPluginRegistrant.m tvos/Runner/GeneratedPluginRegistrant.h; do
            if [ -f "$f" ]; then
              echo "----- $f -----"
              cat "$f"
            fi
          done

      - name: Print tvos/Podfile
        run: |
          echo "===== tvos/Podfile ====="
          cat tvos/Podfile 2>/dev/null || echo "(no tvos/Podfile)"

      - name: Setup host_release tools
        run: |
          flutter precache --ios
          FLUTTER_CACHE=$FLUTTER_ROOT/bin/cache
          mkdir -p tvos-engine/out/host_release/dart-sdk/bin/snapshots
          cp "$FLUTTER_CACHE/dart-sdk/bin/dartaotruntime" tvos-engine/out/host_release/dart-sdk/bin/dartaotruntime
          chmod +x tvos-engine/out/host_release/dart-sdk/bin/dartaotruntime
          cp "$FLUTTER_CACHE/dart-sdk/version" tvos-engine/out/host_release/dart-sdk/version
          cp "$FLUTTER_CACHE/dart-sdk/bin/snapshots/frontend_server_aot.dart.snapshot" \
             tvos-engine/out/host_release/dart-sdk/bin/snapshots/frontend_server_aot.dart.snapshot
          cp -R "$FLUTTER_CACHE/artifacts/engine/common/flutter_patched_sdk" \
             tvos-engine/out/host_release/flutter_patched_sdk
          # Use the tvOS gen_snapshot from the engine zip, not the iOS one
          chmod +x tvos-engine/out/tvos_release/clang_arm64/gen_snapshot
          # Also symlink to the path xcode_appletv.sh checks first
          ln -sf \
            "$PWD/tvos-engine/out/tvos_release/clang_arm64/gen_snapshot" \
            tvos-engine/out/tvos_release/gen_snapshot_arm64


      - name: Generate Generated.xcconfig
        run: |
          cat > tvos/Flutter/Generated.xcconfig << EOF
          FLUTTER_ROOT=$FLUTTER_ROOT
          FLUTTER_APPLICATION_PATH=$PWD
          COCOAPODS_PARALLEL_CODE_SIGN=true
          FLUTTER_TARGET=lib/tvos_probe.dart
          FLUTTER_BUILD_DIR=build
          FLUTTER_BUILD_NAME=${{ steps.version.outputs.build_name }}
          FLUTTER_BUILD_NUMBER=${{ steps.version.outputs.build_number }}
          DART_OBFUSCATION=false
          TRACK_WIDGET_CREATION=false
          TREE_SHAKE_ICONS=false
          PACKAGE_CONFIG=$PWD/.dart_tool/package_config.json
          FLUTTER_LOCAL_ENGINE=$PWD/tvos-engine
          EOF

      - name: Show Generated.xcconfig
        run: |
          echo "===== tvos/Flutter/Generated.xcconfig ====="
          cat tvos/Flutter/Generated.xcconfig
          echo "===== gen_snapshot check ====="
          ls -la tvos-engine/out/tvos_release/gen_snapshot_arm64 || echo "NOT FOUND"
          ls -la tvos-engine/out/tvos_release/clang_arm64/gen_snapshot || echo "NOT FOUND"
          file tvos-engine/out/tvos_release/clang_arm64/gen_snapshot || true


      - name: Install CocoaPods dependencies
        run: cd tvos && pod install

      - name: Build tvOS (no codesign)
        run: |
          cd tvos
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk appletvos \
            -destination generic/platform=tvOS \
            -archivePath $PWD/build/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild.log
          echo "===== xcode_appletv.sh output (grep) ====="
          grep -E "└─|ERROR|error:|warning:|FLUTTER|kernel|gen_snapshot|snapshot|icudtl|App\.framework|Flutter\.framework|BuildApp|BuildAppRelease|BuildAppDebug" \
            /tmp/xcodebuild.log || true
          echo "===== Last 100 lines of build log ====="
          tail -100 /tmp/xcodebuild.log


      - name: Fix icudtl.dat in App bundle
        run: |
          APP="tvos/build/Runner.xcarchive/Products/Applications/Runner.app"
          ASSETS="$APP/Frameworks/App.framework/flutter_assets"
          echo "===== flutter_assets BEFORE ====="
          ls -la "$ASSETS/"
          echo "===== Copying icudtl.dat ====="
          cp tvos-engine/out/tvos_release/Flutter.framework/icudtl.dat \
             "$ASSETS/icudtl.dat"
          echo "===== flutter_assets AFTER ====="
          ls -la "$ASSETS/"
          echo "===== icudtl.dat size ====="
          du -h "$ASSETS/icudtl.dat"
          echo "===== App.framework/App arch check ====="
          file "$APP/Frameworks/App.framework/App"
          echo "===== Flutter.framework/Flutter arch check ====="
          file "$APP/Frameworks/Flutter.framework/Flutter"



      - name: Inspect built app
        run: |
          APP="tvos/build/Runner.xcarchive/Products/Applications/Runner.app"
          echo "===== Frameworks ====="
          ls -la "$APP/Frameworks/"
          echo ""
          echo "===== flutter_assets contents ====="
          ls -la "$APP/Frameworks/App.framework/flutter_assets/" 2>/dev/null || true
          echo ""
          echo "===== icudtl.dat present? ====="
          ls -la "$APP/Frameworks/App.framework/flutter_assets/icudtl.dat" \
            2>/dev/null || echo "MISSING icudtl.dat"
          echo ""
          echo "===== App.framework/App size ====="
          du -h "$APP/Frameworks/App.framework/App" 2>/dev/null
          echo ""
          echo "===== Flutter.framework size ====="
          du -h "$APP/Frameworks/Flutter.framework/Flutter" 2>/dev/null
          echo ""
          echo "===== Key symbols in BUILT Flutter.framework ====="
          nm "$APP/Frameworks/Flutter.framework/Flutter" 2>/dev/null \
            | grep -i "SceneDelegate" \
            || echo "FlutterSceneDelegate NOT in built Flutter.framework"
          nm "$APP/Frameworks/Flutter.framework/Flutter" 2>/dev/null \
            | grep -i "ImplicitEngine" \
            || echo "FlutterImplicitEngineDelegate NOT in built Flutter.framework"


      - name: Create IPA
        run: |
          mkdir -p tvos/Payload
          cp -r tvos/build/Runner.xcarchive/Products/Applications/Runner.app tvos/Payload/
          cd tvos && zip -r plezy-tvos-probe-${{ steps.version.outputs.build_name }}.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tvos-probe-ipa-${{ steps.version.outputs.build_name }}
          path: tvos/plezy-tvos-probe-${{ steps.version.outputs.build_name }}.ipa
