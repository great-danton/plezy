
name: Build tvOS

on:
  workflow_dispatch:
    inputs:
      engine_version:
        description: "Version of the matching edde746/flutter-plezy engine release"
        required: true
        type: string
        default: "3.47.7"

permissions:
  contents: read

jobs:
  build-tvos:
    name: Build Plezy for Apple TV
    runs-on: macos-26
    timeout-minutes: 60

    env:
      FLUTTER_VERSION: "3.47.7"
      ENGINE_VERSION: ${{ inputs.engine_version }}
      TRUSTED_BUILD_CACHE_VERSION: trusted-tvos-v1

    steps:
      - name: Checkout Plezy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read app version
        id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path("pubspec.yaml").read_text()
          match = re.search(r"(?m)^version:\s*['\"]?([^'\"\s#]+)", text)
          if not match:
              raise SystemExit("Could not read version from pubspec.yaml")

          version = match.group(1)
          parts = version.split("+", 1)
          print(f"build_name={parts[0]}")
          print(f"build_number={parts[1] if len(parts) > 1 else '1'}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "${{ env.TRUSTED_BUILD_CACHE_VERSION }}-flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            tvos/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ env.TRUSTED_BUILD_CACHE_VERSION }}-${{ runner.os }}-tvos-pods-${{ hashFiles('tvos/Podfile.lock') }}

      - name: Install Dart dependencies
        run: flutter pub get --no-example

      - name: Prepare Flutter host tools
        run: flutter precache --ios

      - name: Download matching Plezy tvOS engine
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/plezy-engine"

          gh release download "$ENGINE_VERSION" \
            --repo edde746/flutter-plezy \
            --pattern "flutter-tvos-${ENGINE_VERSION}.tar.gz" \
            --dir "$RUNNER_TEMP/plezy-engine"

          ARCHIVE="$RUNNER_TEMP/plezy-engine/flutter-tvos-${ENGINE_VERSION}.tar.gz"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Engine release archive was not downloaded."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/plezy-engine/extracted"
          tar -xzf "$ARCHIVE" \
            -C "$RUNNER_TEMP/plezy-engine/extracted"

          ENGINE_ROOT="$RUNNER_TEMP/plezy-engine/extracted"

          echo "===== Extracted engine layout ====="
          find "$ENGINE_ROOT" -maxdepth 4 -type d | sort

          # The Plezy build script expects these directories directly
          # under FLUTTER_LOCAL_ENGINE/out/.
          if [[ ! -d "$ENGINE_ROOT/out/host_release" ||
                ! -d "$ENGINE_ROOT/out/tvos_release" ]]; then
            echo "::error::Unexpected engine archive layout."
            echo "Expected out/host_release and out/tvos_release."
            echo "Adjust ENGINE_ROOT to the directory containing out/."
            exit 1
          fi

          GEN_SNAPSHOT="$ENGINE_ROOT/out/tvos_release/artifacts_arm64/gen_snapshot_arm64"

          if [[ ! -x "$GEN_SNAPSHOT" ]]; then
            echo "::error::Missing expected tvOS ARM64 gen_snapshot:"
            echo "$GEN_SNAPSHOT"
            find "$ENGINE_ROOT/out/tvos_release" \
              -name 'gen_snapshot*' -print
            exit 1
          fi

          echo "FLUTTER_LOCAL_ENGINE=$ENGINE_ROOT" >> "$GITHUB_ENV"

      - name: Verify engine and Dart toolchain
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="$FLUTTER_LOCAL_ENGINE"

          echo "Flutter:"
          flutter --version

          echo "Engine Dart runtime:"
          if [[ -x "$ENGINE/out/host_release/dart-sdk/bin/dartaotruntime" ]]; then
            "$ENGINE/out/host_release/dart-sdk/bin/dartaotruntime" --version
          else
            echo "Engine does not package dartaotruntime; the build script must use a matching Flutter SDK runtime."
          fi

          echo "Host patched SDK:"
          test -d "$ENGINE/out/host_release/flutter_patched_sdk"

          echo "tvOS Flutter framework:"
          test -d "$ENGINE/out/tvos_release/Flutter.framework"

          echo "Cross-target AOT compiler:"
          "$ENGINE/out/tvos_release/artifacts_arm64/gen_snapshot_arm64" --version

      - name: Generate tvOS Flutter configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tvos/Flutter

          cat > tvos/Flutter/Generated.xcconfig <<EOF
          FLUTTER_ROOT=$FLUTTER_ROOT
          FLUTTER_APPLICATION_PATH=$GITHUB_WORKSPACE
          FLUTTER_LOCAL_ENGINE=$FLUTTER_LOCAL_ENGINE
          FLUTTER_TARGET=lib/main.dart
          FLUTTER_BUILD_DIR=build
          FLUTTER_BUILD_NAME=${{ steps.version.outputs.build_name }}
          FLUTTER_BUILD_NUMBER=${{ steps.version.outputs.build_number }}
          PACKAGE_CONFIG=$GITHUB_WORKSPACE/.dart_tool/package_config.json
          TVOS_DEPLOYMENT_TARGET=15.0
          COCOAPODS_PARALLEL_CODE_SIGN=true
          EOF

          cat tvos/Flutter/Generated.xcconfig

      - name: Wire tvOS plugin implementations
        run: ruby tvos/scripts/wire_plugins.rb

      - name: Install CocoaPods
        run: |
          cd tvos
          pod install

      - name: Build tvOS archive without signing
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -archivePath "$GITHUB_WORKSPACE/build/tvos/Plezy.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/tvos-xcodebuild.log"

      - name: Verify archive and Flutter AOT output
        shell: bash
        run: |
          set -euo pipefail

          APP="build/tvos/Plezy.xcarchive/Products/Applications/Runner.app"
          ASSETS="$APP/Frameworks/App.framework/flutter_assets"

          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/Frameworks/App.framework/App"
          test -f "$APP/Frameworks/Flutter.framework/Flutter"
          test -d "$ASSETS"

          echo "===== App version and bundle ID ====="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"

          echo "===== Flutter assets ====="
          ls -lah "$ASSETS"

          echo "===== AOT executable architectures ====="
          file "$APP/Frameworks/App.framework/App"
          lipo -info "$APP/Frameworks/App.framework/App"

          echo "===== Flutter engine architectures ====="
          file "$APP/Frameworks/Flutter.framework/Flutter"
          lipo -info "$APP/Frameworks/Flutter.framework/Flutter"

          echo "===== Build errors and AOT diagnostics ====="
          grep -Ei \
            'error:|gen_snapshot|Compiling AOT|Compiling Assembly|Linking app|ERROR:' \
            "$RUNNER_TEMP/tvos-xcodebuild.log" | tail -100 || true

          echo "===== Minimum OS versions ====="
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' \
            "$APP/Frameworks/Flutter.framework/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' \
            "$APP/Frameworks/App.framework/Info.plist"

      - name: Create IPA for signing
        shell: bash
        run: |
          set -euo pipefail

          APP="build/tvos/Plezy.xcarchive/Products/Applications/Runner.app"
          STAGING="$RUNNER_TEMP/plezy-tvos-ipa"

          mkdir -p "$STAGING/Payload"
          ditto "$APP" "$STAGING/Payload/Runner.app"

          (
            cd "$STAGING"
            ditto -c -k --sequesterRsrc --keepParent \
              Payload \
              "$GITHUB_WORKSPACE/plezy-tvos-${{ steps.version.outputs.build_name }}.ipa"
          )

          unzip -l "plezy-tvos-${{ steps.version.outputs.build_name }}.ipa" \
            | head -60

      - name: Upload tvOS IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plezy-tvos-${{ steps.version.outputs.build_name }}
          path: plezy-tvos-${{ steps.version.outputs.build_name }}.ipa
          if-no-files-found: error
          retention-days: 14
